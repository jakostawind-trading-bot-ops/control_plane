name: dev_cp

services:
  cp_server:
    build:
      target: dev
    env_file:
      - ./server/.env.dev
    volumes:
      - ./server:/app
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    restart: "no"

networks:
  default:
    name: dev_cp
