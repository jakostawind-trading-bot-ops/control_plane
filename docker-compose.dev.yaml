name: dev_cp

services:
  cp_server:
    build:
      target: dev
    # В dev все настройки сервера берутся из server/.env.dev.
    environment: !reset {}
    env_file:
      - ./server/.env.dev
    volumes:
      - ./server:/app
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - dev_valkey
      - dev_nats

  cp_client:
    build:
      target: dev
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_svelte_kit:/app/.svelte-kit
    restart: "no"

  caddy:
    restart: "no"

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    restart: "no"

volumes:
  dozzle_data:
  client_node_modules:
  client_svelte_kit:

networks:
  default:
    name: dev_cp
  dev_valkey:
    external: true
    name: dev_valkey
  dev_nats:
    external: true
    name: dev_nats
