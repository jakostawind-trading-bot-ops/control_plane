name: dev_cp

services:
  cp_server:
    build:
      target: dev
    env_file:
      - ./server/.env.dev
    volumes:
      - ./server:/app
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - dev_valkey
      - dev_nats

  caddy:
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    restart: "no"

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    restart: "no"

volumes:
  dozzle_data:

networks:
  default:
    name: dev_cp
  dev_valkey:
    external: true
    name: dev_valkey
  dev_nats:
    external: true
    name: dev_nats
